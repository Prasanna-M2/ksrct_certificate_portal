services:
  # 1. Backend API Service
  - type: web
    name: ksrct-portal-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install && npx prisma db push && npx ts-node prisma/seed.ts && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: ksrct-portal-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
