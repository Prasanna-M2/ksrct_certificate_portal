services:
  # 1. Backend Web Service (Node.js Express API)
  - type: web
    name: ksrct-portal-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install && npx prisma db push && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
    disk:
      name: ksrct-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # 2. Frontend Static Site (React Vite SPA)
  - type: web
    name: ksrct-portal-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
