version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ksrct_postgres
    restart: always
    environment:
      POSTGRES_USER: ksrct_user
      POSTGRES_PASSWORD: ksrct_password
      POSTGRES_DB: ksrct_certificate_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
